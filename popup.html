<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WA Media Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="header">
        <div class="logo"></div>
        <h2>WA Media Downloader</h2>
      </div>

      <label class="field">
        <div class="label">Chat</div>
        <select id="chatSelect">
          <option>Current Chat / Select Group</option>
        </select>
      </label>

      <div class="section-title">Media Download</div>

      <div class="row">
        <label class="check"><input type="checkbox" id="optImages" checked /> Images</label>
        <label class="check"><input type="checkbox" id="optVideo" checked /> Video</label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="optAudio" checked /> Audio</label>
        <label class="check"><input type="checkbox" id="optDocs" checked /> Documents</label>
      </div>
      <div class="row" style="margin-top: 4px;">
        <label class="check" title="Scroll up to load oldest chat history before scanning"><input type="checkbox" id="optDeepScan" /> Deep Scan (Full History)</label>
      </div>

      <div class="actions">
        <button id="updateChat" class="btn">Update chat</button>
        <button id="downloadBtn" class="btn primary" disabled>Download</button>
      </div>

      <textarea id="log" class="log" readonly></textarea>

      <footer class="footer">WA Media Downloader</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
